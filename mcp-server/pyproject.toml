[project]
name = "dualtranslate-mcp"
version = "0.1.0"
description = "MCP server for DualTranslate: read device jobs, collect translations, import them back"
requires-python = ">=3.11"
dependencies = ["mcp>=1.2.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
dualtranslate-mcp = "dualtranslate_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
